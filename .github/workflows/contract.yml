# The contract suite against the real agent CLIs (docs/contract-tests.md): nightly, on demand, and when the adapters change.
# It runs on GitHub-hosted runners since the repository went public (decision P2 resolved). A run whose paid checks all
# skipped (no sign-in secret) says so in a warning annotation: it proves only the free contracts.
#
# The gh contracts (GH-*) read this repository with the job's own read-only token; nothing else is needed for them.
# Sign-in: one repository secret, CLAUDE_CODE_OAUTH_TOKEN (made with `claude setup-token`) or ANTHROPIC_API_KEY. Without either
# the paid checks skip and the free ones still run.
# Runner: the repository variable CONTRACT_RUNS_ON, a JSON value such as "windows-latest" or ["self-hosted","windows"]; the
# default is windows-latest, the product's platform, so WIN-ARGV-01 (Windows only) runs too. The suite step uses bash (Git Bash on Windows runners).
name: contract
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      budget:
        description: Spend cap in US dollars for the paid checks (haiku)
        required: false
        default: "1.50"
      latest:
        description: Also install the newest CLI releases and run against them
        type: boolean
        required: false
        default: false
  push:
    paths:
      - "internal/agents/**"
      - "internal/git/host/**"
      - "internal/contract/**"
      - "cmd/drydock-contract/**"
      - ".github/workflows/contract.yml"
permissions:
  contents: read
  # the gh contracts (GH-*) read this repository's pull requests, check runs and comments with the job's own token
  pull-requests: read
  checks: read
  issues: read
concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ${{ fromJSON(vars.CONTRACT_RUNS_ON || '"windows-latest"') }}
    timeout-minutes: 90
    env:
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install the pinned Claude Code unless one is installed
        run: go run ./cmd/drydock-contract --install-pinned claude
      - name: Contract suite (budget cap, version watch)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUDGET: ${{ inputs.budget || '1.50' }}
          LATEST: ${{ inputs.latest && '--latest' || '' }}
        run: go run ./cmd/drydock-contract --out contract-report --budget-usd "$BUDGET" --check-updates $LATEST
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-report
          path: contract-report/
          if-no-files-found: warn
