# Windows is the only product target, so this is the only CI platform (decision P1). The repository is public since
# 2026-10-10, so GitHub-hosted Windows runners are free and these jobs run on every pull request (decision P2 resolved).
# Every job runs on windows-latest unless the repository variable WINDOWS_RUNS_ON names other runner labels as JSON, for
# example ["self-hosted","windows","x64"] for a runner on the owner's PC (docs/windows-runner.md).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ${{ fromJSON(vars.WINDOWS_RUNS_ON || '"windows-latest"') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Git identity for tests
        run: |
          git config --global user.name "Drydock CI"
          git config --global user.email "ci@drydock.invalid"
          git config --global core.autocrlf false
      - name: Placeholder for the built UI
        # the ui package embeds ui/dist (Windows only), which only `npm run build` makes; the app job builds the real one
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ui/dist | Out-Null
          Set-Content ui/dist/index.html '<!doctype html><title>Drydock</title>'
      - run: go vet ./...
      - name: Unit and integration tests (real SQLite, git and child processes; real agent CLIs are never used here)
        # a self-hosted runner may have a signed-in claude: the paid real-agent tests run only in verify.yml, on request
        env:
          DRYDOCK_NO_REAL_AGENTS: "1"
        run: go test ./... -count=1 -timeout 25m
      - name: Windows-only process tree tests
        run: go test ./internal/proc -run "TestKillTree|TestEnterAppJob" -count=1 -v
  repomap-cgo:
    # Decision D5: tree-sitter needs CGO. The repo map ships only if this job is green.
    runs-on: ${{ fromJSON(vars.WINDOWS_RUNS_ON || '"windows-latest"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build and run the tree-sitter probe with CGO
        working-directory: evidence/phase0/go-probes/ts
        env:
          CGO_ENABLED: "1"
        run: go run .
  ui:
    runs-on: ${{ fromJSON(vars.WINDOWS_RUNS_ON || '"windows-latest"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      # remix test runs the component tests in a real Chromium page
      - run: npx playwright install chromium
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run build
        working-directory: ui
  app:
    needs: [go, ui]
    runs-on: ${{ fromJSON(vars.WINDOWS_RUNS_ON || '"windows-latest"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci && npm run build
        working-directory: ui
      - name: Build the Wails app (CGO off, as Wails v3 needs none on Windows)
        env:
          CGO_ENABLED: "0"
        run: go build -tags production -ldflags "-w -s -H windowsgui" -o drydock.exe .
      - uses: actions/upload-artifact@v7
        with:
          name: drydock-windows-unsigned
          path: drydock.exe
