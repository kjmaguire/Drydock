# Concurrency and idempotency: double charges, in-flight requests, replayed responses and what is not stored.
id: tally-idempotent-payments
title: "Make paying an invoice safe to retry"
suite: tally
fixture: testdata/fixtures/tally
class: high-risk
risk: high
size: medium
expected_roles: [backend, reviewer]
prompt: |
  When a customer double-clicks "Pay", or a client retries after a timeout, POST /v1/invoices/{id}/pay can charge the card twice:
  two requests both see the invoice open and both charge. Make paying safe to retry:

  - The endpoint accepts an Idempotency-Key header: 1 to 255 printable ASCII characters (anything else is 400
    {"error":"invalid_idempotency_key"}). Keys belong to an organization: two organizations may use the same key.
  - A request with a key that was already used in the organization, for the same invoice with the same body, gets the first
    request's response again: the same status and the same body, with the header Idempotent-Replayed: true. Nothing is charged
    again.
  - The same key with another invoice or another body: 422 {"error":"idempotency_key_reused"}.
  - While a request with a key is still being handled, another request with the same key gets 409
    {"error":"request_in_progress"} at once; it does not wait.
  - Responses with a status of 500 or more (including 503 gateway_unavailable) are not kept: a retry with the same key tries the
    payment again. Every other response (200, 402 payment_declined, 409 already_paid, 404, ...) is kept and replayed.
  - A kept response is replayed for 24 hours (the service's clock); after that, the key counts as new.
  - With or without keys, two pay requests for the same invoice never both charge: while a charge for an invoice is under way,
    another pay request for that invoice gets 409 {"error":"payment_in_progress"} at once.

  Add tests. Keep existing exported names, signatures and API fields working unless this task says otherwise; adding new ones is fine.
acceptance:
  files: evals/testdata/hidden/tally-idempotent-payments
  commands:
    - go vet ./...
    - go test -count=1 ./...
  timeout_seconds: 600
