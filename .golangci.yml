# golangci-lint v2 configuration (audit F22). CI runs it on every push (ci.yml, job lint); a finding fails the job.
# The default linters (errcheck, govet, ineffassign, staticcheck, unused) are on; what is excluded is written here with why.
version: "2"
run:
  timeout: 10m
  tests: true
linters:
  default: standard
  settings:
    errcheck:
      # Writes to an in-memory buffer, a strings.Builder or a hash cannot fail, and a failed write to a log, a terminal or an
      # HTTP response has no one left to tell; a Close that matters (a file being written) is checked where it is written.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*os.File).Close
        - (net/http.ResponseWriter).Write
        - (*encoding/json.Encoder).Encode
        - (*bytes.Buffer).WriteString
        - (*bytes.Buffer).WriteByte
        - (*bytes.Buffer).Write
        - (*bytes.Buffer).ReadFrom
        - (*strings.Builder).WriteString
        - (*strings.Builder).WriteByte
        - (hash.Hash).Write
        - os.Setenv
        - os.Unsetenv
        - os.Remove
        - os.RemoveAll
        - os.MkdirAll
        - os.WriteFile
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        # Windows handles and registry keys closed after use: nothing to do if closing fails
        - golang.org/x/sys/windows.CloseHandle
        - (golang.org/x/sys/windows/registry.Key).Close
    staticcheck:
      checks:
        - all
        # naming and comment style: the code base's own conventions (ST1003 MixedCaps of initialisms, ST1000/ST1020-22 doc
        # comment forms, ST1005 error strings that start with a capital or end with punctuation in user-facing messages)
        - -ST1000
        - -ST1003
        - -ST1005
        - -ST1020
        - -ST1021
        - -ST1022
        # dot imports and receiver names are fine as written
        - -ST1001
        - -ST1016
        # suggestions, not defects: De Morgan, tagged switches, embedded selectors, merged declarations, inferred types,
        # named HTTP status constants. They stay a reviewer's call.
        - -QF*
        - -S1021
        - -S1025
        - -ST1013
        - -ST1023
        # tests and the untrusted-text scanners carry invisible characters on purpose: they are what is being tested
        - -ST1018
  exclusions:
    generated: lax
    rules:
      # tests may ignore errors of their own scaffolding (writing fixtures, closing temp files): a broken fixture fails the
      # test that reads it
      - path: _test\.go
        linters: [errcheck]
      # gitleaks v8 marks detect.Fragment deprecated in favour of sources.Fragment "in v9", which is not released; move with it
      - path: internal/security/secrets\.go
        linters: [staticcheck]
        text: "SA1019: .*detect.Fragment"
      # Phase 0 probes and fixtures are evidence, not product code
      - path: ^(evidence|testdata)/
        linters: [errcheck, staticcheck, unused]
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
