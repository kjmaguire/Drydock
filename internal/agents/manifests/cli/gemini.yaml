# Gemini CLI over its native ACP mode. API-key or Vertex auth only (decision D2).
meta: {schema: 1, id: gemini, display_name: Gemini CLI, kind: agent_cli, license: Apache-2.0, tier: premium, run_modes: [native]}
binaries: {native: [gemini.cmd, gemini.exe]}
install:
  - {shell: cmd, command: 'npm install -g @google/gemini-cli', requires: [{tool: node, min: "22"}]}   # the CLI needs 20; D9 sets 22
requires: [{tool: node, min: "22"}]                # npm is its only documented install, so Node is needed on every path
detect: {version: {argv: [--version], regex: '(\d+\.\d+\.\d+)'}}
versions: {min: "0.63.0", recommended: "0.65.0"}
auth:
  allowed_kinds: [gemini-api-key, vertex-ai]
  blocked_kinds: [oauth-personal]
  env_from_keyring: {GEMINI_API_KEY: "keyring:gemini-api-key"}
  probe: none                                      # there is no `gemini auth status`
transports:
  primary: acp
  acp:
    argv: [gemini, --acp]
    env: {GEMINI_CLI_TRUST_WORKSPACE: "true"}
  headless:
    argv: [-p, -o, stream-json, --approval-mode, default, --skip-trust]
    optional:
      model: [-m, "{{model}}"]
      resume: [--resume, "{{session_id}}"]
    parser: gemini_stream_json
    interrupt: unverified
    unverified: true
# Gemini CLI refuses to start without a person at a terminal in a folder it does not trust (read in its 0.64.0 source, not run
# here), and in a folder it trusts it loads the folder's own settings, hooks, MCP servers, commands, extensions, skills, policies
# and .env files. GEMINI_CLI_TRUST_WORKSPACE / --skip-trust therefore stay, and Drydock starts it only in a worktree that has
# none of these files, or whose files a person read and trusted (agents.ScanRepoConfig, audit 2026-10-16 M3).
repo_config: [.gemini/settings.json, .gemini/.env, .env, .gemini/commands/, .gemini/extensions/, .gemini/skills/, .gemini/agents/, .gemini/policies/, .agents/skills/]
usage: {normalizer: gemini_result_stats, acp_normalizer: gemini_meta_quota, quota: static_config}
capabilities_declared: {streaming: true, model_selection: true, effort_control: false, session_resume: true, interrupt: true, mcp: true, token_usage: true, cost_reporting: false, headless: true, permission_modes: true, image_input: true, tool_call_visibility: true}
instructions: {primary: GEMINI.md, template: "@AGENTS.md"}
terms:
  notice: gemini-consumer-signin-retired-v1
  warning: >-
    Use a Gemini API key (AI Studio) or Vertex AI. Consumer sign-in (Google AI Pro/Ultra and free individual accounts) was
    reported retired on 2026-06-18 (re-verify), and Google's repository terms call routing Gemini CLI OAuth through
    third-party tools a violation. Drydock does not offer the Google sign-in route.
