# Antigravity (`agy`), the official Google binary the user installed and logged into (decision D2), behind an acknowledgement gate.
# The transport is UNVERIFIED: there is no agy binary in the evidence environment and no captured stream-json fixtures, so
# Drydock detects it and shows it but its adapter refuses to start sessions ("not implemented: no captured protocol fixtures").
meta: {schema: 1, id: antigravity, display_name: Antigravity CLI, kind: agent_cli, license: proprietary, tier: premium, run_modes: [native]}
binaries: {native: [agy.exe]}
install:
  - {shell: powershell, command: 'irm https://antigravity.google/cli/install.ps1 | iex'}
  - {shell: cmd, command: 'curl ... install.cmd (see antigravity.google/cli)'}
detect: {version: {argv: [--version], regex: '(\d+\.\d+\.\d+)'}}   # the flag itself is unverified
versions: {min: "1.3.0", recommended: "1.3.1"}
auth:
  login: {terminal: true, note: "run agy interactively; it authenticates via the system keyring, falling back to Google Sign-In"}
  probe: {argv: [-p, /usage], parse: exit_code, ready_when: 'exit == 0', unverified: true}
gate:
  id: antigravity-third-party-v1
  required: true
  text: >-
    Research found no Google statement permitting third-party orchestration of the Antigravity CLI, and a terms clause barring
    third-party tools from accessing the service, with enforcement history (account suspensions reported in February 2026).
    Drydock only launches the official agy binary you installed and logged into and never touches its credentials. An AI Studio
    or Vertex API key is recommended where available. Acknowledge to enable this Connection.
transports:
  primary: headless
  headless:
    argv: [-p, --input-format, stream-json, --output-format, stream-json, --mode, "{{conservative_mode}}"]
    optional:
      effort: [--effort, "{{effort}}"]
    parser: agy_stream_json
    denied_actions: surface_to_human
    unverified: true                                # --mode values unverified; failures exit 3 with AGY_ERROR on stderr
  acp: {enabled: false, note: "registry antigravity-acp 1.3.0 (agy_acp_server.exe), evaluated later (decision D2)", argv: [agy_acp_server]}
usage: {quota: {argv: [-p, /usage, --json], parse: json_utc}}
capabilities_declared: {streaming: true, model_selection: unknown, effort_control: true, session_resume: unknown, interrupt: unknown, mcp: unknown, token_usage: true, cost_reporting: unknown, headless: true, permission_modes: true, image_input: unknown, tool_call_visibility: unknown}
instructions: {primary: AGENTS.md, secondary: GEMINI.md}
terms: {notice: antigravity-third-party-v1}
