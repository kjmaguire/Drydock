# What was actually run, and how. An entry says what happened on a real install; nothing here is aspirational.
# Classes, weakest first:
#   docs_only       read about, never run
#   inspected       run on Linux without a login: flags, version, ACP initialize (and session/new where it answered)
#   verified_linux  a real turn on Linux with the user's own login: the conformance suite against the real CLI
#   verified_short  a Windows "Test connection" passed
#   verified_full   the Windows full conformance suite passed
# Until a Windows host or Actions runs the suite (decision P2) no entry may exceed verified_linux, and the loader rejects a
# Windows class on a non-Windows platform. Minimums mirror the manifests (a test keeps them equal).
schema: 1
node: {min: "22"}
adapters:
  claude:
    min: "2.1.205"
    recommended: "2.1.277"
    entries:
      - {version: "2.1.294", class: verified_linux, date: 2026-10-08, platform: linux, transport: headless, method: "conformance suite against the real CLI on the sandbox's own login: start, stream, usage, Read tool visibility, interrupt, stop; Test connection with one prompt and a cancel. stream-json with -p needs --verbose (checked)."}
  codex:
    min: "0.159.1"
    recommended: "0.161.0"
    entries:
      - {version: "0.161.0", class: inspected, date: 2026-10-08, platform: linux, transport: headless, method: "codex --version; codex login status (logged out: 'Not logged in', exit 1)"}
      - {version: "0.159.3", class: inspected, date: 2026-10-08, platform: linux, transport: acp, bridge: "@agentclientprotocol/codex-acp@2.1.1", method: "ACP initialize and session/new through the pinned bridge (the bridge launches its own bundled codex 0.159.3); session/new answers authentication required"}
  gemini:
    min: "0.63.0"
    recommended: "0.63.0"
    entries:
      - {version: "0.63.0", class: inspected, date: 2026-10-08, platform: linux, transport: acp, method: "gemini --acp: ACP initialize live; session/new answers authentication required without an API key"}
  opencode:
    min: "1.18.35"
    recommended: "1.18.35"
    entries:
      - {version: "1.18.35", class: inspected, date: 2026-10-08, platform: linux, transport: acp, method: "opencode acp: ACP initialize and session/new live without a login (modes and models are listed); no prompt was sent"}
  goose:
    min: "1.53.0"
    recommended: "1.53.0"
    entries:
      - {version: "1.53.0", class: inspected, date: 2026-10-08, platform: linux, transport: acp, method: "goose acp: ACP initialize live; session/new fails without a configured provider (GOOSE_PROVIDER); no prompt was sent"}
  antigravity:
    min: "1.3.0"
    recommended: "1.3.1"
    entries: []
blocked: []
