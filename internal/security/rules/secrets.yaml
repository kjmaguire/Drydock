# Command class: secrets. Creating, reading or exporting secrets or credentials. Decision: ask (kind secrets_access),
# never remembered by stored rules. Known CLI credential files are a hard deny (hard_deny.yaml).
# ILLUSTRATIVE, NOT EXHAUSTIVE (docs/security.md s5 and s7).
class: secrets
rules:
  - id: secrets.wrangler
    programs: [wrangler, cf]
    subcommands: ["secret put", "secret delete", "secret bulk", "secret list", "secrets-store secret", "pages secret"]
    kind: secrets_access
    paths: none
    reason: manages Worker secrets
  - id: secrets.gh
    programs: [gh]
    subcommands: ["secret set", "secret delete", "secret list", "auth token", "variable set", "variable delete", "auth login", "auth refresh"]
    kind: secrets_access
    paths: none
    reason: reads or changes GitHub secrets or tokens
  - id: secrets.vault_clis
    programs: [vault, op, bw, pass, gopass, doppler, infisical, sops, keepassxc-cli, secret-tool, cmdkey]
    kind: secrets_access
    paths: none
    reason: secret manager CLI
  - id: secrets.gpg_export
    programs: [gpg, gpg2]
    flags_any: ["--export-secret-keys", "--export-secret-subkeys", "-d", "--decrypt"]
    kind: secrets_access
    paths: positional
    reason: exports or decrypts secret material
  - id: secrets.cloud
    programs: [aws, az, gcloud]
    subcommands: ["secretsmanager get-secret-value", "ssm get-parameter", "ssm get-parameters", "keyvault secret", "secrets versions access", "secrets create", "sts get-session-token", "configure get", "auth print-access-token", "auth application-default print-access-token", "account get-access-token"]
    kind: secrets_access
    paths: none
    reason: reads secrets or tokens from a cloud provider
  - id: secrets.git_credential
    programs: [git]
    subcommands: ["credential fill", "credential approve", "credential reject", "credential-manager", "credential-store"]
    kind: secrets_access
    paths: none
    reason: reads or stores git credentials
  - id: secrets.security_mac
    programs: [security]
    subcommands: [find-generic-password, find-internet-password, dump-keychain, export]
    kind: secrets_access
    paths: none
    reason: reads the keychain
  - id: secrets.ps
    programs: [get-credential, get-secret, set-secret, convertfrom-securestring, export-pfxcertificate, get-pfxcertificate, get-storedcredential, new-storedcredential, get-azkeyvaultsecret, set-azkeyvaultsecret, remove-azkeyvaultsecret]
    ci: true
    shells: [powershell]
    kind: secrets_access
    paths: positional
    reason: handles credentials or secrets
  - id: secrets.cmd
    programs: [cmdkey, vaultcmd, certutil]
    ci: true
    shells: [cmd]
    kind: secrets_access
    paths: none
    reason: reads or stores credentials
# Paths that look like secret material. A command touching one asks (kind secrets_access); regular expressions are
# matched case-insensitively against the argument with separators normalized to "/".
secret_paths:
  - '(^|/)\.env(\.[^/]+)?$'
  - '\.(pem|pfx|p12|key|keystore|jks|ppk|kdbx)$'
  - '(^|/)id_(rsa|dsa|ecdsa|ed25519)(\.[^/]*)?$'
  - '(^|/)\.ssh/'
  - '(^|/)\.aws/(credentials|config)$'
  - '(^|/)\.kube/config$'
  - '(^|/)\.docker/config\.json$'
  - '(^|/)\.npmrc$'
  - '(^|/)\.pypirc$'
  - '(^|/)\.pgpass$'
  - '(^|/)(secrets?|credentials?)\.(json|ya?ml|toml|txt)$'
# Placeholders that are safe to read.
secret_paths_exclude:
  - '\.(example|sample|template|dist|defaults?)$'
