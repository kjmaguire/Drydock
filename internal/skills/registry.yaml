# Curated skill registries (docs/expert-packs.md section 9). This is the allowlist: Drydock fetches skills from these
# repositories and from no others. A human adds, disables or removes entries (with a warning); nothing here is imported until
# a human picks a skill, and an imported skill stays "offered" until a human accepts it.
# Seeded from Phase 0 evidence [tool §7]. Last-commit dates, per-skill licenses and skill counts are UNVERIFIED (github.com was
# unreachable in Phase 0); none is asserted here.
schema: 1
registries:
  - {id: cloudflare-skills, repo: cloudflare/skills, root: skills/, license: Apache-2.0, trust: vendor_official, also: "docs site publishes /.well-known/agent-skills/* (index.json, SKILL.md, tarballs)", notes: "wrangler skill defers to cf CLI when cloudflare.config.ts exists"}
  - {id: stripe-ai, repo: stripe/ai, root: skills/, license: MIT, trust: vendor_official, notes: "synced from docs.stripe.com/.well-known/skills"}
  - {id: remix, repo: remix-run/remix, root: .agents/skills/, license: MIT, trust: vendor_official, notes: "Remix 3 (Drydock's UI framework; it replaced the react-router entry on 2026-10-14). The root holds all 19 skills of the repository: the remix skill for building Remix 3 apps (the remix package and remix/* imports) and 18 skills written for contributors working on the framework itself (make-pr, supersede-pr, publish-placeholder-package, write-tests and others). The person picks which ones a project uses; until 2026-10-16 the root was .agents/skills/remix and offered only the app skill."}
  - {id: microsoft-skills, repo: microsoft/skills, root: .github/skills/, license: MIT, trust: vendor_official, import: selective_only, notes: "175 skills; repo warns loading all causes context rot"}
  - {id: msdocs-agent-skills, repo: MicrosoftDocs/Agent-Skills, license: CC-BY-4.0, trust: vendor_official}
  - {id: msdocs-mcp-skills, repo: MicrosoftDocs/mcp, license: "content CC BY 4.0, code MIT", trust: vendor_official, notes: "3 skills: microsoft-docs, microsoft-code-reference, microsoft-skill-creator"}
  - {id: vercel-agent-skills, repo: vercel-labs/agent-skills, license: MIT, trust: vendor_official}
  - {id: openai-skills, repo: openai/skills, license_scope: per_skill, trust: vendor_official, notes: "license is per skill (LICENSE.txt)"}
  - {id: anthropic-skills, repo: anthropics/skills, license_scope: per_skill, import: per_skill_review, trust: vendor_official, notes: "no root LICENSE; some skills are source-available"}
  - {id: msgraph-community, repo: merill/msgraph, license: MIT, trust: community, notes: "no official Microsoft Graph skills repo found. The skill needs its references/ indexes and scripts/bin executables (112 MB), which Drydock does not import (only SKILL.md and LICENSE; scripts are never delivered)"}

# Skills Drydock names in its shipped catalogs (the prebuilt agents, internal/agentcatalog), with the description from each
# skill's own SKILL.md front matter at the pinned commit and its license, so a page can say what a skill does before anything
# is fetched. Read from raw.githubusercontent.com at these exact commits on 2026-10-12 (decision P43). The license is the
# skill's LICENSE.txt or front matter when it has one, otherwise the repository's: Anthropic's per-skill LICENSE.txt files
# are Apache-2.0; Vercel's composition-patterns and react-best-practices say MIT in their front matter and the repository's
# README says MIT for the rest; cloudflare/skills has an Apache-2.0 LICENSE; MicrosoftDocs/mcp has LICENSE (CC BY 4.0) for
# content and LICENSE-CODE (MIT) for code. A test checks that every prebuilt agent's skill is listed here at its pin.
skills:
  - registry: anthropic-skills
    name: frontend-design
    ref: 683bc88e56f3e09ba94f7055977f3d3aa499f202
    path: skills/frontend-design
    license: Apache-2.0
    description: "Guidance for distinctive, intentional visual design when building new UI or reshaping an existing one. Helps with aesthetic direction, typography, and making choices that don't read as templated defaults."
  - registry: anthropic-skills
    name: mcp-builder
    ref: 683bc88e56f3e09ba94f7055977f3d3aa499f202
    path: skills/mcp-builder
    license: Apache-2.0
    description: "Guide for creating high-quality MCP (Model Context Protocol) servers that enable LLMs to interact with external services through well-designed tools. Use when building MCP servers to integrate external APIs or services, whether in Python (FastMCP) or Node/TypeScript (MCP SDK)."
  - registry: vercel-agent-skills
    name: web-design-guidelines
    ref: 063bee94c3f4df8453406c830b0a7df0f2860278
    path: skills/web-design-guidelines
    license: MIT
    description: "Review UI code for Web Interface Guidelines compliance. Use when asked to \"review my UI\", \"check accessibility\", \"audit design\", \"review UX\", or \"check my site against best practices\"."
  - registry: vercel-agent-skills
    name: react-best-practices
    ref: 063bee94c3f4df8453406c830b0a7df0f2860278
    path: skills/react-best-practices
    license: MIT
    description: "React and Next.js performance optimization guidelines from Vercel Engineering. This skill should be used when writing, reviewing, or refactoring React/Next.js code to ensure optimal performance patterns. Triggers on tasks involving React components, Next.js pages, data fetching, bundle optimization, or performance improvements."
  - registry: vercel-agent-skills
    name: composition-patterns
    ref: 063bee94c3f4df8453406c830b0a7df0f2860278
    path: skills/composition-patterns
    license: MIT
    description: "React composition patterns that scale. Use when refactoring components with boolean prop proliferation, building flexible component libraries, or designing reusable APIs. Triggers on tasks involving compound components, render props, context providers, or component architecture. Includes React 19 API changes."
  - registry: vercel-agent-skills
    name: writing-guidelines
    ref: 063bee94c3f4df8453406c830b0a7df0f2860278
    path: skills/writing-guidelines
    license: MIT
    description: "Review docs/prose for Writing Guidelines compliance. Use when asked to \"review my docs\", \"check writing style\", \"audit prose\", \"review docs voice and tone\", or \"check this page against the writing handbook\"."
  - registry: cloudflare-skills
    name: cloudflare
    ref: a18ffe2a99448ebff262fc87915b0fd14bab9b70
    path: skills/cloudflare
    license: Apache-2.0
    description: "Discover and choose Cloudflare products for apps, APIs, AI agents, storage, networking, and security. Use for architecture and product selection, including when the user describes a need without naming a Cloudflare product; then find the relevant skill or documentation."
  - registry: cloudflare-skills
    name: workers-best-practices
    ref: a18ffe2a99448ebff262fc87915b0fd14bab9b70
    path: skills/workers-best-practices
    license: Apache-2.0
    description: "Cloudflare Workers best practices for production applications. Use when writing, reviewing, or configuring Workers."
  - registry: cloudflare-skills
    name: wrangler
    ref: a18ffe2a99448ebff262fc87915b0fd14bab9b70
    path: skills/wrangler
    license: Apache-2.0
    description: "Run or troubleshoot Wrangler CLI commands and configure Worker projects for local development, Previews, deployment, and Cloudflare resource management."
  - registry: cloudflare-skills
    name: durable-objects
    ref: a18ffe2a99448ebff262fc87915b0fd14bab9b70
    path: skills/durable-objects
    license: Apache-2.0
    description: "Build, debug, or review Cloudflare Durable Objects code for persistent state and coordination."
  - registry: msdocs-mcp-skills
    name: microsoft-docs
    ref: f8ffde185dfd232dbf5d187c22ce299eadc3d583
    path: skills/microsoft-docs
    license: "CC-BY-4.0 (content), MIT (code)"
    description: "Understand Microsoft technologies by querying official documentation. Use whenever the user asks how something works, wants tutorials, needs configuration options, limits, quotas, or best practices for any Microsoft technology (Azure, .NET, M365, Windows, Power Platform, etc.)—even if they don't mention \"docs.\" If the question is about understanding a concept rather than writing code, this is the right skill."
  - registry: msdocs-mcp-skills
    name: microsoft-code-reference
    ref: f8ffde185dfd232dbf5d187c22ce299eadc3d583
    path: skills/microsoft-code-reference
    license: "CC-BY-4.0 (content), MIT (code)"
    description: "Find working code samples, verify API signatures, and fix Microsoft SDK errors using official docs. Use whenever the user is writing, debugging, or reviewing code that touches any Microsoft SDK, .NET library, Azure client library, or Microsoft API—even if they don't ask for a \"reference.\" Catches hallucinated methods, wrong signatures, and deprecated patterns. If the task involves producing or fixing Microsoft-related code, this is the right skill."
